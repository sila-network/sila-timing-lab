#
# Scaleway Elastic Metal (x86-64, Ubuntu 24.04) for the S-8 timing run.
# Paste unchanged into the "cloud-init" field when creating the server.
# It contains NO token or other secret.
#
# First boot: low-noise kernel settings (core 2 isolated, SMT off),
# automatic updates and snapd off, the registration script installed,
# then a reboot. Afterwards the owner registers the single-job runner with
# one command over SSH (the token is typed into a hidden prompt):
#   sudo -iu s8runner bash /opt/sila-s8/register.sh amd64-baremetal
# Generated from runner/register.sh (embedded, base64).
users:
  - default
  - name: s8runner
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
package_update: true
packages: [git, curl, ca-certificates, util-linux]
write_files:
  - path: /etc/default/grub.d/99-sila-s8.cfg
    content: |
      GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT isolcpus=2 nohz_full=2 rcu_nocbs=2 nosmt"
  - path: /opt/sila-s8/register.sh
    permissions: "0755"
    encoding: b64
    content: 
runcmd:
  - systemctl disable --now unattended-upgrades.service apt-daily.timer apt-daily-upgrade.timer snapd.service snapd.socket || true
  - update-grub
  - touch /opt/sila-s8/ready
  - reboot
