#
# Self-test of the lab tooling on a GitHub-hosted runner. It measures
# nothing and never counts for S-8; it checks that the scripts parse and
# that the evidence check rejects every failed or incomplete result.
name: Lab self-test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Script syntax
        run: |
          bash -n runner/register.sh scripts/check_evidence.sh scripts/test_check_evidence.sh
          python3 -c "import yaml; [yaml.safe_load(open(f)) for f in ('runner/cloud-init-amd64.yaml', '.github/workflows/s8-timing.yml')]"
      - name: cloud-init embeds the current register.sh and no secret
        run: |
          python3 - <<'PY'
          import base64, yaml
          d = yaml.safe_load(open('runner/cloud-init-amd64.yaml'))
          emb = [f for f in d['write_files'] if f['path'] == '/opt/sila-s8/register.sh'][0]
          assert base64.b64decode(emb['content']) == open('runner/register.sh', 'rb').read(), 'stale embedded register.sh'
          text = open('runner/cloud-init-amd64.yaml').read().lower()
          assert 'token' not in yaml.dump([f for f in d['write_files'] if f['path'] != '/opt/sila-s8/register.sh']).lower()
          print('cloud-init ok')
          PY
      - name: Registered runner labels satisfy the timing job
        run: |
          # The job needs self-hosted + sila-s8 + the machine label; the
          # runner keeps its default labels (incl. self-hosted) and adds ours.
          grep -q 'runs-on: \[self-hosted, sila-s8, ' .github/workflows/s8-timing.yml
          # (no "! grep": a negated command never fails a "bash -e" step)
          if grep -q -- '--no-default-labels' runner/register.sh; then echo "::error::--no-default-labels drops self-hosted"; exit 1; fi
          grep -q -- '--labels "sila-s8,$label"' runner/register.sh
          echo "labels ok"
      - name: Timing workflow guards
        run: |
          w=.github/workflows/s8-timing.yml
          grep -q "github.ref == 'refs/heads/main'" $w              # main branch only
          grep -q "github.event_name == 'workflow_dispatch'" $w     # manual only
          if grep -nE '^\s+(push|pull_request|pull_request_target|schedule):' $w; then echo "::error::automatic trigger"; exit 1; fi
          if grep -nE '(checkout|fetch).*\|\| *true|\"\$GITHUB_SHA\" *\|\|' $w; then echo "::error::ignored checkout/fetch failure"; exit 1; fi
          grep -q '\[ "\$head" = "\$GITHUB_SHA" \]' $w            # exact dispatched commit
          grep -q 'SILA_COMMIT_EMAIL is not set; set it before starting' $w
          if grep -n 'pull .*--rebase' $w; then echo "::error::shallow rebase in the result step"; exit 1; fi
          grep -q 'git -C "$dest" config user.email "$COMMIT_EMAIL"' $w   # identity in the result clone
          if grep -rni 'private repository' $w runner README.md; then echo "::error::stale 'private' wording"; exit 1; fi
          echo "guards ok"
      - name: macOS bash >= 4.4 is ensured before registration
        run: |
          r=runner/register.sh; w=.github/workflows/s8-timing.yml
          for c in /opt/homebrew/bin/bash /usr/local/bin/bash /opt/local/bin/bash; do
            grep -q "$c" $r || { echo "::error::register.sh does not look for $c"; exit 1; }
            grep -q "$c" $w || { echo "::error::preflight does not look for $c"; exit 1; }
          done
          # The bash check comes before the token prompt (registration).
          [ "$(grep -n 'bash >= 4.4 is required' $r | cut -d: -f1)" -lt "$(grep -n 'Paste the runner registration token' $r | cut -d: -f1)" ]
          echo "macOS bash ok"
      - name: Evidence check accepts only complete passing runs
        run: bash scripts/test_check_evidence.sh
      - name: Autonomous x86-64 server (signed endpoint, two-phase cloud-init, run.sh)
        run: |
          python3 -m pip install --quiet --user "cryptography==44.0.3"
          sudo apt-get install -y -qq cloud-init nftables caddy >/dev/null
          sudo systemctl disable --now caddy >/dev/null 2>&1 || true
          cd autonomous
          bash -n run.sh endpoint.sh
          python3 -m py_compile serve.py collect.py build_cloud_init.py test_run.py
          # Signed, read-only endpoint (+ unauthenticated /health = phase only).
          python3 -I test_autonomous.py
          # run.sh: phase-1 failures stop early and never pass; phase 2 only
          # after phase 1; interruption resumes, never counts partial output.
          python3 -I test_run.py
          # The same with the REAL Go 1.25.14 download, checksum and go list
          # at the approved SHA (as root: run.sh uses /var/cache).
          sudo env PATH="$PATH" S8_REAL_GO=1 python3 -I test_run.py
          # cloud-init: built from this commit; public keys only; phase 1 =
          # stock boot (no reboot, no grub), provider firewalls off at boot,
          # SSH key-only on 22, firewall 22/80/443; valid for cloud-init itself.
          key=$(python3 -c 'import base64,os;print(base64.b64encode(os.urandom(32)).decode())')
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/owner" -C selftest
          python3 -I build_cloud_init.py "$key" "$(git rev-parse HEAD)" "$(cat "$RUNNER_TEMP/owner.pub")" > "$RUNNER_TEMP/ci.yaml"
          cloud-init schema --config-file "$RUNNER_TEMP/ci.yaml"
          python3 - "$RUNNER_TEMP/ci.yaml" "$RUNNER_TEMP/owner" <<'PY'
          import base64, re, sys, yaml
          text = open(sys.argv[1]).read()
          d = yaml.safe_load(text)
          files = {f["path"]: f for f in d["write_files"]}
          for path, src in [("/opt/sila-s8/run.sh", "run.sh"), ("/opt/sila-s8/serve.py", "serve.py"),
                            ("/opt/sila-s8/endpoint.sh", "endpoint.sh"), ("/opt/sila-s8/check_evidence.sh", "../scripts/check_evidence.sh")]:
              assert base64.b64decode(files[path]["content"]) == open(src, "rb").read(), path
          plain = "\n".join(l for l in text.splitlines() if "encoding" not in l and not re.match(r"\s+content: [A-Za-z0-9+/=]{200,}$", l))
          assert not re.search(r"ghp_|github_pat_|ghs_|BEGIN [A-Z ]*PRIVATE KEY|SCW[A-Z0-9]{17}|X-Auth-Token|Bearer", plain), "secret-like text"
          priv = open(sys.argv[2]).read().split("\n")[1]
          assert priv not in text, "owner private key leaked"
          assert d["ssh_pwauth"] is False and len(d["ssh_authorized_keys"]) == 1 and d["ssh_authorized_keys"][0].startswith("ssh-ed25519 ")
          assert "PasswordAuthentication no" in files["/etc/ssh/sshd_config.d/00-sila-s8.conf"]["content"]
          assert any("ufw --force disable" in str(c) for c in d["bootcmd"]), "provider firewall must be off from boot"
          nft = files["/etc/nftables.conf"]["content"]
          assert "tcp dport { 22, 80, 443 } accept" in nft and "policy drop" in nft, "firewall"
          cmds = "\n".join(map(str, d["runcmd"]))
          assert not re.search(r"\breboot\b|update-grub|kexec", cmds) and not any("grub" in p for p in files), "phase 1 must not reboot or change boot"
          assert "disable --now ssh" not in cmds, "SSH must stay on"
          unit = files["/etc/systemd/system/sila-s8-measure.service"]["content"]
          assert "After=cloud-final.service" in unit and "Slice=sila-s8.slice" in unit and "ConditionKernelCommandLine" not in unit
          assert "TimeoutStartSec=6h" in unit
          assert "127.0.0.1" in base64.b64decode(files["/opt/sila-s8/serve.py"]["content"]).decode()
          assert "timeout --kill-after=60 5h ./scripts/timing_dedicated.sh" in base64.b64decode(files["/opt/sila-s8/run.sh"]["content"]).decode()
          open("/tmp/nft.conf", "w").write(nft)
          print("cloud-init ok")
          PY
          sudo nft -c -f /tmp/nft.conf && echo "nftables syntax ok"
          # Real nftables in a network namespace + real Caddy in front of serve.py.
          sudo env PATH="$PATH" bash test_network.sh "$RUNNER_TEMP/ci.yaml"
          # An SSH private key or a malformed key is refused.
          if python3 -I build_cloud_init.py "$key" "$(git rev-parse HEAD)" "$(cat "$RUNNER_TEMP/owner")" >/dev/null 2>&1; then echo "::error::private key accepted"; exit 1; fi
          # Provenance: a modified worktree is never embedded; an unknown commit is refused.
          echo "# local change" >> run.sh
          python3 -I build_cloud_init.py "$key" "$(git rev-parse HEAD)" "$(cat "$RUNNER_TEMP/owner.pub")" > "$RUNNER_TEMP/ci2.yaml"
          python3 -c "import yaml,base64,sys; d=yaml.safe_load(open(sys.argv[1])); f={x['path']:x for x in d['write_files']}; assert b'local change' not in base64.b64decode(f['/opt/sila-s8/run.sh']['content'])" "$RUNNER_TEMP/ci2.yaml"
          git checkout -- run.sh
          if python3 -I build_cloud_init.py "$key" 0000000000000000000000000000000000000000 "$(cat "$RUNNER_TEMP/owner.pub")" >/dev/null 2>&1; then echo "::error::unknown lab commit accepted"; exit 1; fi
          echo "provenance ok"
      - name: Billing guard (reaper) logic
        run: |
          python3 -m py_compile autonomous/reaper.py
          python3 -I autonomous/test_reaper.py
          grep -q 'cron: "7-59/10 \* \* \* \*"' .github/workflows/s8-reaper.yml
          grep -q 'SCW_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}' .github/workflows/s8-reaper.yml
          grep -q -- '--max-age-min 300' .github/workflows/s8-reaper.yml
          echo "reaper ok"
          python3 -m py_compile autonomous/vultr_reaper.py autonomous/vultr_provision.py
          python3 -I autonomous/test_vultr_reaper.py
          python3 -I autonomous/test_vultr_provision.py
          # Owner's decision: deletion is manual. The reaper workflow stays
          # dormant (no secret) and, if ever enabled, must not cut a valid
          # measurement short (5 h bound + setup < 350 min). No other
          # automatic deletion exists.
          w=.github/workflows/s8-vultr-reaper.yml
          grep -q -- '--probe-delete --max-age-min 350' $w
          grep -q 'DORMANT by the owner' $w
          if ls .github/workflows | grep -q watchdog; then echo "::error::unexpected automatic-deletion workflow"; exit 1; fi
          if grep -n 'DELETE' autonomous/vultr_provision.py | grep -v 'def delete\|call("DELETE", f"/bare-metals/{sid}")'; then echo "::error::unexpected deletion path in vultr_provision.py"; exit 1; fi
          echo "Vultr: manual deletion, dormant reaper ok"
          python3 -m py_compile autonomous/scw_job.py
          python3 -I autonomous/test_scw_job.py
      - name: Autonomous run rejects a virtual machine (this runner) and never counts it
        run: |
          t=$(mktemp -d); mkdir -p "$t/home"; cp scripts/check_evidence.sh "$t/home/"; echo "lab commit: selftest" > "$t/home/lab.txt"
          if sudo env SILA_S8_STATE="$t/state" SILA_S8_HOME="$t/home" bash autonomous/run.sh; then echo "::error::run.sh accepted a VM"; exit 1; fi
          grep -q 'PREFLIGHT FAILED: virtualization detected' "$t/state/out/machine.txt"
          sudo test -s "$t/state/out/SHA256SUMS"
          if bash scripts/check_evidence.sh "$t/state/out" amd64-baremetal full 75939d59602318e8eb3561b150cf0944035a03b5 >/dev/null 2>&1; then echo "::error::evidence accepted"; exit 1; fi
          echo "VM rejected, evidence not accepted"
