#
# Billing guard for an S-8 server on Vultr bare metal, independent of any
# operator session: every 10 minutes (minutes 5, 15, ..., 55, away from the
# busy top of the hour) delete Vultr bare-metal servers labelled sila-s8-*
# AND tagged sila-s8 that are 5 h 50 min old or older, not active/pending, or past
# their sila-s8-delete-after tag. The key (secret VULTR_REAPER_API_KEY) is
# never printed.
#
# The key belongs to a separate Vultr IAM service user whose policy allows
# only compute.baremetal.List, Read and Delete (no Create, no billing, no
# other product). GitHub-hosted runners have changing addresses, so only
# this service user's own API allowlist admits any address; the account's
# main key keeps its own address restriction. Every run first proves the
# delete permission (--probe-delete: DELETE of a non-existent id must
# answer 404, not 401/403), so a revoked or downgraded key fails visibly.
#
# DORMANT by the owner's decision (2026-11-19: the owner deletes the Vultr
# server manually). It runs only once on main AND with the secret set; if
# enabled it WOULD delete an S-8 server automatically at 5 h 50 min. Leave the
# secret unset (or disable this workflow in Actions) to keep deletion manual.
name: S-8 billing guard (Vultr reaper)

on:
  schedule:
    - cron: "5-59/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List only, delete nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: s8-vultr-reaper
  cancel-in-progress: false

jobs:
  reap:
    if: github.repository == 'sila-network/sila-timing-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Delete expired S-8 Vultr servers
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_REAPER_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: python3 -I autonomous/vultr_reaper.py $DRY_RUN --probe-delete --max-age-min 350
